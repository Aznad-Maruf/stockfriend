name: Update Stock Data

on:
  schedule:
    # Run daily at 9:00 AM UTC (3:00 PM Bangladesh time, after DSE closes at 2:30 PM)
    - cron: '0 9 * * 0-4'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run stock data scraper
        run: python3 scripts/update_stocks.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/stocks.csv public/data/scraper_status.json public/data/research.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.csv public/data/scraper_status.json public/data/research.json
          git commit -m "data: update stock data $(date -u +%Y-%m-%d)"
          git push
