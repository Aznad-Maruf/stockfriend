name: Update Stock Data & Deploy

on:
  schedule:
    # DSE trades Sun-Thu, 10AM-2:30PM BD time (UTC+6)
    - cron: '0 5 * * 0-4'   # 11:00 AM BD — mid-morning
    - cron: '0 7 * * 0-4'   # 1:00 PM BD — early afternoon
    - cron: '30 9 * * 0-4'  # 3:30 PM BD — after market close
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch stock data
        run: python3 scripts/update_stocks.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run research analyzer
        run: python3 scripts/research/analyzer.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.csv public/data/research.json public/data/scraper_status.json public/data/history/
          git commit -m "data: auto-update stock data $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: update-stocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
