<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockFriend — Get personalized stock recommendations for Bangladesh's DSE & CSE. Answer a few questions and receive tailored investment advice based on your goals, risk tolerance, and budget." />
    <meta name="keywords" content="stock market, DSE, CSE, Bangladesh, investment, shares, portfolio, stock recommendations, বিনিয়োগবন্ধু" />
    <meta name="author" content="StockFriend" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>StockFriend — Smart Stock Investment Advisor | বিনিয়োগবন্ধু</title>
  </head>
  <body>
    <!-- Matrix splash screen -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;background:#0c1222;font-family:'Inter',system-ui,sans-serif;overflow:hidden;transition:opacity .5s ease-out;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <style>
        #splash{animation:splashIn .4s ease-out}
        #splash.hide{opacity:0;pointer-events:none}
        @keyframes splashIn{from{opacity:0}to{opacity:1}}
        .sp-mx{position:absolute;inset:0;overflow:hidden}
        .sp-mx-col{position:absolute;top:-100%;color:#14b8a6;font-size:.7rem;font-family:'Courier New',monospace;line-height:1.4;animation:mxFall linear infinite;white-space:pre}
        @keyframes mxFall{from{transform:translateY(-100%)}to{transform:translateY(100vh)}}
        .sp-mx-logo{position:relative;z-index:2;font-size:2.5rem;font-weight:800;color:#fff;text-shadow:0 0 30px rgba(20,184,166,.5),0 0 60px rgba(20,184,166,.3)}
        .sp-mx-logo span{color:#14b8a6}
        .sp-mx-sub{position:relative;z-index:2;color:#5eead4;font-size:.8rem;margin-top:.5rem;opacity:0;animation:mxSubIn 1s ease-out 1s forwards}
        @keyframes mxSubIn{to{opacity:1}}
        .sp-msg{color:#64748b;font-size:.72rem;position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);animation:msgP 2s ease-in-out infinite}
        @keyframes msgP{0%,100%{opacity:.6}50%{opacity:1}}
      </style>

      <div class="sp-mx" id="mx-bg"></div>
      <div class="sp-mx-logo">Stock<span>Friend</span></div>
      <div class="sp-mx-sub">Decoding the market...</div>
      <div class="sp-msg">StockFriend is preparing your experience</div>

      <script>
      (function(){
        var mx=document.getElementById('mx-bg');
        if(mx){
          var syms='GP SQUR BATBC WALTON BRAC BEXIMCO ৳259 ৳220 +1.2% -0.5% ▲ ▼ BUY HOLD SELL'.split(' ');
          for(var c=0;c<20;c++){
            var col=document.createElement('div');
            col.className='sp-mx-col';
            col.style.cssText='left:'+c*5+'%;animation-duration:'+(4+Math.random()*6)+'s;animation-delay:'+Math.random()*3+'s;opacity:'+(0.12+Math.random()*0.35)+';font-size:'+(0.55+Math.random()*0.3)+'rem';
            var tx='';
            for(var r=0;r<15;r++)tx+=syms[Math.floor(Math.random()*syms.length)]+'\n';
            col.textContent=tx;
            mx.appendChild(col);
          }
        }
      })();
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
