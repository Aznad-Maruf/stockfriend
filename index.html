<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockFriend — Get personalized stock recommendations for Bangladesh's DSE & CSE. Answer a few questions and receive tailored investment advice based on your goals, risk tolerance, and budget." />
    <meta name="keywords" content="stock market, DSE, CSE, Bangladesh, investment, shares, portfolio, stock recommendations, বিনিয়োগবন্ধু" />
    <meta name="author" content="StockFriend" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>StockFriend — Smart Stock Investment Advisor | বিনিয়োগবন্ধু</title>
  </head>
  <body>
    <!-- Inline splash: visible until React mounts -->
    <div id="splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0c1222;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:fixed;inset:0;z-index:9999;transition:opacity .4s ease-out">
      <style>
        #splash{animation:splashIn .4s ease-out}
        #splash.hide{opacity:0;pointer-events:none}
        @keyframes splashIn{from{opacity:0}to{opacity:1}}
        .sp-logo{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:2.5rem;letter-spacing:-.02em}
        .sp-logo span{color:#14b8a6}
        .sp-chart{width:min(320px,80vw);margin-bottom:2rem;filter:drop-shadow(0 4px 20px rgba(20,184,166,.25))}
        .sp-line{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2s ease-in-out forwards}
        .sp-area{opacity:0;animation:areaIn .6s ease-out 1.5s forwards}
        .sp-dot{opacity:0;animation:dotIn .3s ease-out 1.8s forwards,dotPulse 1.5s ease-in-out 2.1s infinite}
        .sp-bar{width:3px;background:linear-gradient(to top,transparent,#14b8a6);border-radius:2px;animation:barGrow 1.2s ease-out forwards}
        .sp-bars{display:flex;align-items:flex-end;gap:6px;height:48px;margin-bottom:2rem;opacity:0;animation:barsIn .4s ease-out .3s forwards}
        .sp-msg{color:#94a3b8;font-size:.9rem;animation:msgPulse 2s ease-in-out infinite;letter-spacing:.02em}
        .sp-ticker{display:flex;gap:1.5rem;margin-top:2rem;opacity:0;animation:tickerIn .5s ease-out 2.2s forwards}
        .sp-tick{display:flex;flex-direction:column;align-items:center;gap:4px}
        .sp-tick-name{color:#64748b;font-size:.65rem;font-weight:600;letter-spacing:.08em}
        .sp-tick-price{font-size:.85rem;font-weight:600}
        .sp-tick-up{color:#22c55e}
        .sp-tick-down{color:#ef4444}
        .sp-tick-flat{color:#f59e0b}
        @keyframes draw{to{stroke-dashoffset:0}}
        @keyframes areaIn{to{opacity:1}}
        @keyframes dotIn{to{opacity:1}}
        @keyframes dotPulse{0%,100%{r:4;opacity:1}50%{r:7;opacity:.6}}
        @keyframes barGrow{from{height:0}to{height:var(--h)}}
        @keyframes barsIn{to{opacity:1}}
        @keyframes msgPulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes tickerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      </style>
      <div class="sp-logo">Stock<span>Friend</span></div>
      <div class="sp-bars">
        <div class="sp-bar" style="--h:18px;animation-delay:.4s"></div>
        <div class="sp-bar" style="--h:30px;animation-delay:.5s"></div>
        <div class="sp-bar" style="--h:22px;animation-delay:.6s"></div>
        <div class="sp-bar" style="--h:38px;animation-delay:.7s"></div>
        <div class="sp-bar" style="--h:28px;animation-delay:.8s"></div>
        <div class="sp-bar" style="--h:44px;animation-delay:.9s"></div>
        <div class="sp-bar" style="--h:35px;animation-delay:1s"></div>
        <div class="sp-bar" style="--h:48px;animation-delay:1.1s"></div>
      </div>
      <svg class="sp-chart" viewBox="0 0 300 100">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0d9488"/>
            <stop offset="50%" stop-color="#14b8a6"/>
            <stop offset="100%" stop-color="#5eead4"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0d9488" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="25" x2="300" y2="25" stroke="#1e293b" stroke-dasharray="4 4"/>
        <line x1="0" y1="50" x2="300" y2="50" stroke="#1e293b" stroke-dasharray="4 4"/>
        <line x1="0" y1="75" x2="300" y2="75" stroke="#1e293b" stroke-dasharray="4 4"/>
        <path class="sp-area" d="M0,75 Q40,68 80,55 T160,38 T240,45 T300,22 L300,100 L0,100Z" fill="url(#g2)"/>
        <path class="sp-line" d="M0,75 Q40,68 80,55 T160,38 T240,45 T300,22" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
        <circle class="sp-dot" cx="300" cy="22" r="4" fill="#14b8a6"/>
      </svg>
      <div class="sp-ticker">
        <div class="sp-tick"><span class="sp-tick-name">GP</span><span class="sp-tick-price sp-tick-up">▲ ৳259</span></div>
        <div class="sp-tick"><span class="sp-tick-name">SQUR</span><span class="sp-tick-price sp-tick-up">▲ ৳220</span></div>
        <div class="sp-tick"><span class="sp-tick-name">BATBC</span><span class="sp-tick-price sp-tick-down">▼ ৳226</span></div>
        <div class="sp-tick"><span class="sp-tick-name">WALTON</span><span class="sp-tick-price sp-tick-flat">● ৳386</span></div>
      </div>
      <p class="sp-msg" style="margin-top:2rem">Analyzing the market for you...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
